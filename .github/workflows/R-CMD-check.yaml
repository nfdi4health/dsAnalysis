name: R-CMD-check

on:
  pull_request:
    branches: [dev]
  schedule:
    - cron: '15 7 * * 1'
  workflow_dispatch:

jobs:
  check:
    uses: nfdi4health/datashield-workflows/.github/workflows/r-cmd-check.yml@main
    with:
      r-version-list: '["release"]'
    secrets:
      CODECOV_TOKEN: ${{ secrets.CODECOV_TOKEN }}

  keepalive:
    if: github.event_name == 'schedule'
    permissions:
      actions: write
    uses: nfdi4health/datashield-workflows/.github/workflows/workflow-keepalive.yml@main
