name: R-CMD-check

on:
  pull_request:
    branches: [dev]
  schedule:
    - cron: '15 7 * * 1'
  workflow_dispatch:

jobs:
  check:
    uses: nfdi4health/datashield-workflows/.github/workflows/r-cmd-check.yml@main
    with:
      # The way CRAN checks: as-cran on ubuntu, macOS and windows, with R
      # release and devel (as cran-check.yml and the release check).
      os-list: '["ubuntu-latest", "macos-latest", "windows-latest"]'
      r-version-list: '["release", "devel"]'
      as-cran: true
      # no package binaries for R-devel on macOS: dependencies would be
      # built from source, which fails on the runner (not on CRAN)
      matrix-exclude: '[{"os": "macos-latest", "r-version": "devel"}]'
      # dsSupportClient isn't on CRAN yet: CRAN's incoming checks would
      # warn on every run. Switch back on once it is.
      cran-incoming: false
    secrets:
      CODECOV_TOKEN: ${{ secrets.CODECOV_TOKEN }}

  keepalive:
    if: github.event_name == 'schedule'
    permissions:
      actions: write
    uses: nfdi4health/datashield-workflows/.github/workflows/workflow-keepalive.yml@main
