name: Test Suggestions

on:
  pull_request:
    branches: [dev]
    paths: ['R/**']
  workflow_dispatch:

jobs:
  suggest-tests:
    permissions:
      id-token: write
      contents: write
      pull-requests: write
      issues: write
    uses: nfdi4health/datashield-workflows/.github/workflows/test-suggest.yml@main
    with:
      datashield-type: utility
    secrets:
      anthropic-organization-id: ${{ secrets.ANTHROPIC_ORG_ID }}
      anthropic-service-account-id: ${{ secrets.ANTHROPIC_SVAC_ID }}
      anthropic-federation-rule-id: ${{ secrets.ANTHROPIC_FDRL_TESTS }}
      app-client-id: ${{ secrets.APP_CLIENT_ID }}
      app-private-key: ${{ secrets.APP_PRIVATE_KEY }}

  keepalive:
    if: github.event_name == 'schedule'
    permissions:
      actions: write
    uses: nfdi4health/datashield-workflows/.github/workflows/workflow-keepalive.yml@main
